<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        img{
            animation: fadeimg 3s infinite alternate;
        }
       @keyframes fadeimg {
            0% {
                filter: grayscale(100%);
            }
            25% {
                filter: grayscale(75%);
            }
            50% {
                filter: grayscale(50%);
            }
            75% {
                filter: grayscale(25%);
            }
            100% {
                filter: grayscale(0%);
            }
        }

       
        
    </Style>
</head>
<body>
    <img src="https://m.media-amazon.com/images/S/pv-target-images/4610704d82fa0a71915a595e8ff556393a1b381d22410062f0e2ec3a1f8d88f7._SX1080_FMjpg_.jpg" alt="Batman" title="Batman">
</body>
</html>

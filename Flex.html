<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #flexContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            gap: 10px;
            /* flex-direction: column; */
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
        }

        .card {
            background-color: red;
            height: 100px;
            width: 100px;
            /* margin-bottom: 10px; */
        }
    </style>
</head>

<body>
    <div id="flexContainer">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </div>
</body>

</html>
